name: backend-docker-build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          cd backend
          docker build -t chronexa-web-backend:ci .
      - name: Run container + health check
        run: |
          docker run --rm -d --name chrx -p 8001:8001 chronexa-web-backend:ci
          sleep 5
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:8001/health; then
              echo ""; echo "HEALTH OK"; docker stop chrx; exit 0
            fi
            sleep 2
          done
          docker logs chrx; docker stop chrx; exit 1
