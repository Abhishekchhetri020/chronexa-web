name: backend-docker-build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          cd backend
          docker build -t chronexa-web-backend:ci .

      - name: Start container
        run: |
          # The image binds $PORT (7860 by default, HF convention). Mapping
          # 8001:8001 left the published port with nothing behind it, so the
          # health check got "connection reset" while uvicorn was healthy —
          # this workflow was red for months because of that mismatch.
          docker run -d --name chrx -p 8001:7860 chronexa-web-backend:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/health; then
              echo "HEALTH OK on attempt $i"
              exit 0
            fi
            sleep 1
          done
          echo "Container never became healthy. Logs:"
          docker logs chrx
          exit 1

      - name: Smoke test /solve (async start + poll)
        run: |
          cat > /tmp/fixture.json <<'JSON'
          {
            "school": {
              "schoolName": "CI",
              "bell": {"periods": [
                {"index": 1, "label": "P1", "startMin": 0, "endMin": 40, "isTeaching": true},
                {"index": 2, "label": "P2", "startMin": 40, "endMin": 80, "isTeaching": true}
              ]},
              "teachers": [{"id": "T1", "name": "A"}],
              "classes": [{"id": "C1", "name": "VI"}],
              "classrooms": [{"id": "R1", "name": "R"}],
              "subjects": [{"id": "S1", "name": "Math"}],
              "lessons": [{
                "id": "L1", "classIds": ["C1"], "teacherIds": ["T1"],
                "subjectId": "S1", "periodsPerWeek": 2
              }]
            },
            "options": {"timeLimitSec": 5, "seed": 1}
          }
          JSON
          # The API is async since the job queue landed: /solve/start returns a
          # job id and /solve/status/{id} carries the result. The old smoke test
          # posted to /solve, which no longer exists (404).
          START=$(curl -fsS -X POST http://127.0.0.1:8001/solve/start \
                  -H 'Content-Type: application/json' --data @/tmp/fixture.json)
          echo "start: $START"
          JOB=$(echo "$START" | sed -n 's/.*"jobId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          test -n "$JOB" || { echo "no jobId in $START"; exit 1; }

          for i in $(seq 1 40); do
            BODY=$(curl -fsS "http://127.0.0.1:8001/solve/status/$JOB")
            echo "poll $i: $BODY" | head -c 400; echo
            case "$BODY" in
              *'"state":"done"'*|*'"state": "done"'*) break ;;
              *'"state":"error"'*|*'"state": "error"'*) echo "job errored"; exit 1 ;;
            esac
            sleep 1
          done
          echo "$BODY" | grep -q '"placed"'
          echo "$BODY" | grep -q 'OPTIMAL'
      - name: Print logs on failure
        if: failure()
        run: docker logs chrx || true

      - name: Stop container
        if: always()
        run: docker stop chrx || true
