# Static CI checks for Chronexa Web frontend resources
name: frontend-static-check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "package.json"
      - "vite.config.js"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "package.json"
      - "vite.config.js"

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML sanity check
        run: |
          test -s index.html
          grep -q "<title>" index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: JS smoke check
        run: |
          # Every js/**/*.js must parse cleanly via node (no syntax errors).
          # package.json sets "type": "module", so .js files parse as ESM.
          find js -type f -name "*.js" -not -path "js/solver/wasm/node_modules/*" | while read f; do
            node --check "$f" || (echo "SYNTAX ERROR: $f" && exit 1)
          done
      - name: Vite build
        run: |
          npm ci
          npm run build
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: E2E tests (playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload E2E traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - name: Built page serves
        run: |
          python3 -m http.server 8000 --directory dist &
          SERVER=$!
          sleep 2
          curl -sf http://localhost:8000/ > /dev/null
          curl -sf http://localhost:8000/index.html > /dev/null
          curl -sf http://localhost:8000/sw.js > /dev/null
          kill $SERVER
