<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#fde68a" stroke-width="8" opacity="0.5"/>
  <g transform="translate(256 256)">
    <!-- Hour hand pointing to 10 -->
    <line x1="0" y1="0" x2="-72" y2="-72" stroke="#fde68a" stroke-width="16" stroke-linecap="round"/>
    <!-- Minute hand pointing to 2 -->
    <line x1="0" y1="0" x2="92" y2="-46" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
    <circle r="14" fill="#10b981"/>
  </g>
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="68" font-weight="700" fill="#f1f5f9" text-anchor="middle">Chronexa</text>
</svg>
