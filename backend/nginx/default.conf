# Chronexa Web — Nginx config.
#
# - Port 80: ACME challenge + 301 to 443.
# - Port 443: TLS terminator + reverse proxy to the FastAPI app on app:8001.
# - Gzip enabled. Long timeouts for the solver (max 60 s + buffer).
# - Rate limit on /solve: 30 req/min per IP (burst 10, no delay).
#
# Replace `chronexa.example.com` with your domain in BOTH server blocks before
# running docker-compose. DEPLOY.md walks through this.

# --- rate-limit zone -----------------------------------------------------
limit_req_zone $binary_remote_addr zone=solve_zone:10m rate=30r/m;

# --- HTTP (80): ACME + redirect -----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name chronexa.example.com;

    # Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: force HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (443): app proxy ---------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chronexa.example.com;

    ssl_certificate     /etc/letsencrypt/live/chronexa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chronexa.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reasonable defaults.
    client_max_body_size 10m;
    keepalive_timeout    65s;

    # Gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # --- /solve: rate-limit + long timeout -----------------------------
    location = /solve {
        limit_req zone=solve_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://app:8001/solve;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }

    # --- everything else: plain proxy ----------------------------------
    location / {
        proxy_pass         http://app:8001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
